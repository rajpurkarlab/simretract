# Tool asset recipe: how the source file becomes the tool mesh under
# assets/tools/retractor_rake/, and what the result must reproduce.
# Read by simretract-build-assets and simretract.sim.mesh_convert; the
# procedure and the checks are explained in docs/ASSETS.md.
tool: retractor_rake

# The drop-in source. Place the folder as downloaded under
# assets/source/<pack>/ (git-ignored except assets/source/README.md); the
# converter takes <file> from it unless tool_source (configs/envs.local.yaml
# or SIMRETRACT_TOOL_SOURCE) overrides the path. The file is recognised by
# sha256 (or by file name, with a warning).
source:
  pack: vretractor
  file: vretractor.fbx
  sha256: df9689bc33e997417d2898406cdb7214cbabde58744513b2ddd0013950061cbb
  size_bytes: 210860
  listing: "Operating Volkman Retractor Surgical Instrument"
  creator: HQ3DMOD
  listing_url: https://www.fab.com/listings/28243153-9617-4d27-a1c1-779d22e6f61a
  license: Fab Standard License
  license_url: https://www.fab.com/eula
  ai_usage: "the listing states: Allows usage with AI: Yes"
  folder_contents: [vretractor.fbx, textures/]    # the textures are not used by the simulation
  select: ovrsi_retractor_body                     # the only mesh node of the file
  scale: 0.01474075                                # source units -> metres
  # half-turn about y, applied with the scale before the converter's own
  # repair, centring and alignment steps (docs/ASSETS.md)
  pre_rotate: [[-1, 0, 0], [0, 1, 0], [0, 0, -1]]
  # Converter reference measurements: centroid offset and collision geometry.
  # meta.json records 21 parts / 7.848 cm3; the collision check accepts
  # a difference of 3 parts and 5% hull volume.
  expected_center_removed_pre_m: [-0.01806, 0.00234, 0.0]
  observed_collision_parts: [20, 21]
  observed_collision_hull_cm3: [7.82, 8.00]

# Source-independent conversion settings.
conversion:
  align_z: true
  coacd_threshold: 0.015

# The reference values in assets/tools/retractor_rake/meta.json (checked by
# the converter and the USD builder: extents 0.1 mm, volume 1%, collision set
# within 3 parts and 5% hull volume).
expected_meta:
  extents_m: [0.03059, 0.00967, 0.21631]
  longest_m: 0.21631
  watertight: true
  volume_m3: 6.611e-06
  n_collision_parts: 21
  collision_hull_volume_m3: 7.848e-06
  suggested_tip: [-0.00677, 0.0012, 0.12624]
  suggested_bend: [-0.0, 0.00033, 0.09956]

