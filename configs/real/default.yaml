# Real deployment. Set the robot address before using dry or go.
robot:
  follower_ip: CHANGE_ME
  model: wxai_v0

services:
  host: 127.0.0.1
  policy_port: 8765
  mask_port: 8766
  boot_timeout_s: 450

mask:
  sam3_ckpt: checkpoints/sam3/sam3.pt
  prompt: metal rake
  conf: 0.2

# Default: validated real-run timing and a 1 cm shaft crop.
# Metric lengths are metres; plane_top_cut is the legacy pixel fraction.
presets:
  default:
    exec_h: 50
    exec_min: 50
    settle: 0.0
    speed: 0.8
    max_step: 0.06
    smooth: 0.6
    view: true
    plane_top_cut: 0.0
    plane_top_cut_m: 0.01
  parity:
    exec_h: 20
    exec_min: 20
    settle: 0.0
    speed: 1.0
    max_step: 0.06
    smooth: 0.45
    view: false
    plane_top_cut: 0.0
    plane_top_cut_m: 0.0
  conservative:
    exec_h: 10
    exec_min: 5
    settle: 0.25
    speed: 0.5
    max_step: 0.03
    smooth: 0.45
    view: false
    plane_top_cut: 0.0
    plane_top_cut_m: 0.01
