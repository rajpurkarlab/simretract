# Named training rows for `simretract-train --preset <name>`.
#
# `defaults` is the complete flag set of the baseline row; each preset lists
# only what it changes, and simretract.config.preset() returns the merged,
# fully explicit flag set (every key of `defaults` is present in every preset).
# Keys are the trainer's argparse destinations. `${paths.*}` and `${hub.*}`
# references are expanded from configs/paths.yaml and configs/hub.yaml.
#
# Reference hardware: 1x H200 (141 GB) at batch 16 x accum 4 (effective 64),
# 15k steps: pi0 ~7.5 h, SmolVLA ~2.6 h, ACT ~1.1 h. On a 32 GB card use
# --batch 8 --accum 8 (same effective batch; pi0 needs more than 32 GB).
#
# Semantics of the four switches (the trainer derives nothing from them; the
# concrete flags below are what it reads, and they must agree):
#   data      full        = strict + recovery, 50/50 set sampling
#             strict_only = strict alone (frame-proportional sampling)
#             half        = full data, deterministic half selection (RNG 0) done in-process
#   ablation  none | no_plane (7-D state) | no_mask (unmasked RGB-D) | no_depth (single camera) | no_aug
#   dropout   late-trajectory blind dropout + plane deterioration (see docs/DROPOUT.md)
#   policy    pi0 | smolvla | act | fastwam | pi05 | pi0_fast

schema: 1

defaults:
  # switches
  policy: pi0
  data: full
  ablation: none
  dropout: true
  # data
  sets: [strict, recovery]                 # cache set names (configs/data.yaml)
  set_frac: [0.5, 0.5]                     # per-set sampling probability; null = frame-proportional
  subset_json: null                        # explicit {set: [episode indices]} filter (written by --data half)
  episodes: all                            # all | strict (verdict filter; unused by the shipped rows)
  trim: close                              # train only up to gripper close + margin
  resample: arc                            # arc-length resampling (no-op on pre-kept caches)
  normalize: zscore
  # inputs
  input_mode: masked_rgbd                  # masked RGB + masked float depth as two camera streams
  state: qpos_plane                        # 7 joints + 3-D plane normal
  float_depth: true                        # depth stays float32 end-to-end
  nogrip: true                             # the gripper mask is never an input
  no_aug: false                            # disable all train-time augmentation (ablation only)
  chunk_h: 50                              # action chunk length
  video_t: 0                               # fastwam only: future kept frames per sample
  video_ratio: 6                           # fastwam only: kept-frame spacing of the video stack
  # schedule
  steps: 15000
  batch: 16
  accum: 4
  lr: 2.5e-5
  warmup: 1000
  save_every: 5000
  init: "${paths.checkpoints}/pi0_base"    # local directory (simretract-download base-weights)
  # backbone regimes
  smolvla_full: true                       # smolvla: unfreeze VLM + vision, baseline optimizer
  act_opt: baseline                        # act: baseline | official optimizer regime
  # dropout rule
  drop_mask_p: 0.25                        # P(blind frame) at the close, ramped from drop_start
  drop_plane_p: 0.0                        # P(plane-only zero) at the close
  drop_start: 0.5                          # ramp start as a fraction of the kept trajectory
  plane_sig: 3.0                           # plane-normal noise sigma (deg) at ramp start
  plane_sig_end: 8.0                       # sigma at the close
  plane_glitch_p: 0.03                     # 10-45 deg glitch probability at ramp start
  plane_glitch_end: 0.25                   # glitch probability at the close
  plane_rand_frac: 0.5                     # share of glitches that become a random normal (w > 0)

presets:
  # ---- reference rows (core-50, three-pass protocol; docs/ABLATIONS.md) ---------------
  baseline:
    description: pi0, strict-500 + recovery far-1000 (50/50), masked RGB + depth, plane state, dropout on
    reference: {grabbed: 50, secured: 49, held: 33, kept: 23, timeouts: 0}

  no_recovery:
    description: A0 - strict-500 only (no recovery data)
    data: strict_only
    sets: [strict]
    set_frac: null
    reference: {grabbed: 47, secured: 42, held: 27, kept: 17, timeouts: 3}

  no_depth:
    description: A3 - single masked-RGB camera, no depth stream
    ablation: no_depth
    input_mode: masked_rgb_nodepth
    reference: {grabbed: 50, secured: 47, held: 37, kept: 30, timeouts: 0}

  half_data:
    description: A7 - half of both sets (250 strict seeds + 500 far episodes, bin-balanced, RNG 0)
    data: half
    reference: {grabbed: 49, secured: 45, held: 35, kept: 16, timeouts: 1}

  smolvla:
    description: SmolVLA backbone, VLM + vision unfrozen, baseline optimizer, same data and inputs
    policy: smolvla
    init: "${hub.base_weights.smolvla}"
    reference: {grabbed: 50, secured: 47, held: 40, kept: 9, timeouts: 0}

  act:
    description: ACT backbone (ResNet-18, from scratch), baseline optimizer, same data and inputs
    policy: act
    init: null
    reference: {grabbed: 42, secured: 27, held: 19, kept: 10, timeouts: 8}

  # ---- optional rows (no reference numbers; trained without the dropout rule) --------
  no_plane:
    description: A1 - 7-D joint state, no plane normal
    ablation: no_plane
    state: qpos
    dropout: false
    drop_mask_p: 0.0
    plane_sig_end: 3.0
    plane_glitch_end: 0.03
    plane_rand_frac: 0.0

  no_mask:
    description: A2 - unmasked RGB + unmasked depth
    ablation: no_mask
    input_mode: full_rgbd
    dropout: false
    drop_mask_p: 0.0
    plane_sig_end: 3.0
    plane_glitch_end: 0.03
    plane_rand_frac: 0.0

  no_aug:
    description: A4 - no train-time augmentation (mask corruption, fills, depth artefacts, plane noise)
    ablation: no_aug
    no_aug: true
    dropout: false
    drop_mask_p: 0.0
    plane_sig_end: 3.0
    plane_glitch_end: 0.03
    plane_rand_frac: 0.0

  fastwam:
    description: Fast-WAM backbone (video co-training, 48-step chunks); needs the fastwam environment
    policy: fastwam
    init: "${hub.base_weights.fastwam}"
    chunk_h: 48
    video_t: 9
    video_ratio: 6
    dropout: false
    drop_mask_p: 0.0
    plane_sig_end: 3.0
    plane_glitch_end: 0.03
    plane_rand_frac: 0.0

  pi05:
    description: pi0.5 backbone (state digitised into the prompt), baseline optimizer regime
    policy: pi05
    init: "${hub.base_weights.pi05}"
    dropout: false
    drop_mask_p: 0.0
    plane_sig_end: 3.0
    plane_glitch_end: 0.03
    plane_rand_frac: 0.0

  pi0_fast:
    description: pi0-FAST backbone (FAST action tokenizer, official optimizer preset)
    policy: pi0_fast
    init: "${hub.base_weights.pi0_fast}"
    dropout: false
    drop_mask_p: 0.0
    plane_sig_end: 3.0
    plane_glitch_end: 0.03
    plane_rand_frac: 0.0
