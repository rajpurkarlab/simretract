# Named training rows for `simretract-train --preset <name>`.
#
# `defaults` is the complete flag set of the baseline row; each preset lists
# only what it changes, and simretract.config.preset() returns the merged,
# fully explicit flag set (every key of `defaults` is present in every preset).
# Keys are the trainer's argparse destinations. `${paths.*}` and `${hub.*}`
# references are expanded from configs/paths.yaml and configs/hub.yaml.
# Presets carry flags and a description only; benchmark results are not
# recorded here.
#
# Reference hardware: 1x H200 (141 GB) at batch 16 x accum 4 (effective 64),
# 15k steps: pi0 ~7.5 h. On a 32 GB card use --batch 8 --accum 8 (same
# effective batch; pi0 needs more than 32 GB).
#
# Semantics of the switches (the trainer derives nothing from them; the
# concrete flags below are what it reads, and they must agree):
#   data      full        = strict + recovery, 50/50 set sampling
#             strict_only = strict alone (frame-proportional sampling)
#             half        = full data, deterministic half selection (RNG 0) done in-process
#   ablation  none | no_plane (7-D state) | no_mask (unmasked RGB-D)
#             (no_depth and no_aug remain trainer switches without a preset)
#   dropout   late-trajectory blind dropout + plane deterioration (docs/DROPOUT.md);
#             on in every preset except no_dropout
#   sets      the cache pair a row trains on (configs/data.yaml): the no_smooth and
#             no_standoff rows keep the baseline flags and swap the data
#   policy    pi0 in every preset; other backbones are trainer flags (docs/ABLATIONS.md)

schema: 1

defaults:
  # switches
  policy: pi0
  data: full
  ablation: none
  dropout: true
  # data
  sets: [strict, recovery]                 # cache set names (configs/data.yaml)
  set_frac: [0.5, 0.5]                     # per-set sampling probability; null = frame-proportional
  subset_json: null                        # explicit {set: [episode indices]} filter (written by --data half)
  episodes: all                            # all | strict (verdict filter; unused by the shipped rows)
  trim: close                              # train only up to gripper close + margin
  resample: arc                            # arc-length resampling (no-op on pre-kept caches)
  normalize: zscore
  # inputs
  input_mode: masked_rgbd                  # masked RGB + masked float depth as two camera streams
  state: qpos_plane                        # 7 joints + 3-D plane normal
  float_depth: true                        # depth stays float32 end-to-end
  nogrip: true                             # the gripper mask is never an input
  no_aug: false                            # disable all train-time augmentation (ablation only)
  chunk_h: 50                              # action chunk length
  video_t: 0                               # fastwam only: future kept frames per sample
  video_ratio: 6                           # fastwam only: kept-frame spacing of the video stack
  # schedule
  steps: 15000
  batch: 16
  accum: 4
  lr: 2.5e-5
  warmup: 1000
  save_every: 5000
  init: "${paths.checkpoints}/pi0_base"    # local directory (simretract-download base-weights)
  # backbone regimes (used only with --policy smolvla / act)
  smolvla_full: true                       # smolvla: unfreeze VLM + vision, baseline optimizer
  act_opt: baseline                        # act: baseline | official optimizer regime
  # dropout rule
  drop_mask_p: 0.25                        # P(blind frame) at the close, ramped from drop_start
  drop_plane_p: 0.0                        # P(plane-only zero) at the close
  drop_start: 0.5                          # ramp start as a fraction of the kept trajectory
  plane_sig: 3.0                           # plane-normal noise sigma (deg) at ramp start
  plane_sig_end: 8.0                       # sigma at the close
  plane_glitch_p: 0.03                     # 10-45 deg glitch probability at ramp start
  plane_glitch_end: 0.25                   # glitch probability at the close
  plane_rand_frac: 0.5                     # share of glitches that become a random normal (w > 0)

presets:
  baseline:
    description: pi0, strict-500 + recovery far-1000 (50/50), masked RGB + depth, plane state, dropout rule on

  no_dropout:
    description: baseline flags with the dropout rule off (constant plane noise, no blind frames)
    dropout: false
    drop_mask_p: 0.0
    drop_plane_p: 0.0
    plane_sig_end: 3.0
    plane_glitch_end: 0.03
    plane_rand_frac: 0.0

  no_recovery:
    description: strict-500 only (no recovery co-training)
    data: strict_only
    sets: [strict]
    set_frac: null

  half_data:
    description: half of both sets (250 strict seeds + 500 far episodes, bin-balanced, RNG 0)
    data: half

  no_plane:
    description: 7-D joint state, no plane normal
    ablation: no_plane
    state: qpos

  no_mask:
    description: unmasked RGB + unmasked depth to the policy (the mask still feeds the plane fit)
    ablation: no_mask
    input_mode: full_rgbd

  no_smooth:
    description: baseline flags on the no-smoothing data (straight-segment reach, no standoff control point)
    sets: [strict_nosmooth, recovery_nosmooth]

  no_standoff:
    description: baseline flags on the no-standoff data (smoothed reach curving straight to the grasp)
    sets: [strict_nostandoff, recovery_nostandoff]
