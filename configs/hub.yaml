# Third-party weights and tokenizers pulled from their canonical hub locations.
# Gated entries need `huggingface-cli login` after accepting the licence.
# The backbone entries serve `simretract-train --policy <name>` (docs/ABLATIONS.md,
# "Other backbones"); the smolvla preset initialises from `smolvla`, no other
# preset uses them.
base_weights:
  paligemma_tokenizer: google/paligemma-3b-pt-224        # gated (Gemma terms); pi0 prompt tokenizer
  sam3: facebook/sam3                                    # gated (SAM licence); file sam3.pt
  smolvla: lerobot/smolvla_base                          # --policy smolvla (Apache-2.0)
  smolvlm_tokenizer: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  resnet18: torchvision:ResNet18_Weights.IMAGENET1K_V1   # --policy act, fetched by torchvision
  fastwam: lerobot/fastwam_base                          # --policy fastwam
  pi05: lerobot/pi05_base                                # --policy pi05
  pi0_fast: lerobot/pi0fast-base                         # --policy pi0_fast
  fast_tokenizer: lerobot/fast-action-tokenizer          # --policy pi0_fast
